# Workspace patch of crates.io `zed-scap` 0.0.8-zed
# (checksum b6b338d705ae33a43ca00287c11129303a7a0aa57b101b72a1c08c863f698ac8).
#
# Delta vs registry: the macOS-only `cocoa` / `objc` / `screencapturekit` /
# `screencapturekit-sys` / `tao-core-video-sys` / `core-graphics-helmer-fork`
# dependencies are omitted so they leave this workspace's lockfile.
# Linux / Windows / FreeBSD capture code and features are unchanged.
# fc-gpui never compiles scap on macOS (native objc2-screen-capture-kit).
#
# This crate is not published. Published fc-gpui-* manifests still depend on
# registry `zed-scap 0.0.8-zed`; the patch is workspace-only.
# See README.md.
[package]
name = "zed-scap"
description = "Modern, high-performance screen capture library for Rust. Cross-platform."
version = "0.0.8-zed"
edition = "2021"
rust-version = "1.71"
license = "MIT"
authors = [
    "Siddharth <siddharth99c@gmail.com>",
    "Pranav <pranav2000joglekar@gmail.com>",
]
readme = "README.md"
repository = "https://github.com/helmerapp/scap"
documentation = "https://docs.rs/scap"
keywords = ["screen", "recording", "video", "capture", "media"]
categories = ["graphics", "multimedia", "multimedia::video"]
publish = false

[features]
default = ["wayland", "x11"]
wayland = ["dep:pipewire", "dep:dbus"]
x11 = ["dep:xcb", "dep:x11"]

[dependencies]
anyhow = "1.0.86"
log = "0.4.16"
sysinfo = "0.31.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "1.3.6"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
rand = "0.8.5"
xcb = { version = "1.4.0", features = ["randr", "xlib_xcb", "xfixes"], optional = true }
x11 = { version ="2.21.0", optional = true }
pipewire = { version = "0.8.0", optional = true }
dbus = { version = "0.9.7", optional = true }
