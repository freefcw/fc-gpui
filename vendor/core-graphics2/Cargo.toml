# Workspace patch of crates.io `core-graphics2` 0.5.2
# (checksum 4416167a69126e617f8d0a214af0e3c1dbdeffcb100ddf72dcd1a1ac9893c146).
#
# Delta vs registry: `block` is optional and enabled only by `display-stream`.
# Registry 0.5.2 hard-depends on `block` for `src/display_stream.rs` only.
# `core-video` 0.5.2 enables only the `display` feature here (color space /
# geometry for `CVImageBuffer`). fc-gpui does not use CGDisplayStream.
#
# This crate is not published. The patch is workspace-only.
# See README.md.

[package]
edition = "2021"
name = "core-graphics2"
version = "0.5.2"
authors = ["Zhou Wei <zhouwei@ehom.net>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Safe bindings to CoreGraphics framework, including display stream"
homepage = "https://github.com/rust-media/apple-media-rs"
documentation = "https://docs.rs/core-graphics2"
readme = "README.md"
keywords = [
    "coregraphics",
    "display",
    "displaystream",
    "screencapture",
]
categories = [
    "graphics",
    "multimedia",
    "os::macos-apis",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-media/apple-media-rs"
publish = false

[package.metadata.docs.rs]
no-default-features = true
features = [
    "display",
    "display-stream",
    "event",
    "objc",
    "window",
]
default-target = "x86_64-apple-darwin"
targets = [
    "x86_64-apple-darwin",
    "x86_64-apple-ios",
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
]

[features]
default = [
    "display",
    "display-stream",
    "event",
    "link",
    "window",
]
display = []
display-stream = [
    "dep:block",
    "dep:dispatch2",
    "dep:io-surface",
    "display",
    "objc",
]
event = []
link = ["core-foundation/link"]
objc = ["dep:objc2"]
window = []

[lib]
name = "core_graphics2"
path = "src/lib.rs"

[[example]]
name = "display_stream"
path = "examples/display_stream.rs"

[dependencies.bitflags]
version = "2.5"

[dependencies.block]
version = "0.1"
optional = true

[dependencies.cfg-if]
version = "1.0"

[dependencies.core-foundation]
version = "0.10"
default-features = false

[dependencies.dispatch2]
version = "0.1"
optional = true

[dependencies.io-surface]
version = "0.16"
optional = true

[dependencies.libc]
version = "0.2"

[dependencies.metal]
version = "0.33"
optional = true

[dependencies.objc2]
version = "0.5"
optional = true

[dev-dependencies]
