# Fork of crates.io `ksni` 0.3.7
# (checksum 1bcc1cb43797140f74b711f1c4a49f48a7a7429f211c5fb78264e7bcd1e99caf).
#
# The only behavioral delta is the Ayatana label extension marked `fc-gpui:`
# in src/: `XAyatanaLabel`, `XAyatanaLabelGuide`, and `XAyatanaNewLabel`.
# Published as its own crate so fc-gpui-linux does not depend on a workspace
# `[patch]` that downstream lockfiles would not see. See README.md.
[package]
name = "fc-ksni"
version = "0.3.7"
authors = ["iovxw <iovxw@outlook.com>"]
edition = "2021"
rust-version = "1.80"
description = "Fork of ksni 0.3.7 with Ayatana tray labels (XAyatanaLabel) for fc-gpui"
repository = "https://github.com/freefcw/fc-gpui"
keywords = ["systray", "linux", "gui"]
categories = ["api-bindings"]
license = "Unlicense"
readme = "README.md"

[lib]
name = "ksni"
path = "src/lib.rs"

# Upstream ksni 0.3.7 is not clippy-clean under `-D warnings`. Cargo clippy
# lints this path dependency. These allows cover that existing code; the
# Ayatana patch does not add new warnings.
[lints.clippy]
let_unit_value = "allow"
map_flatten = "allow"
mem_replace_with_default = "allow"
needless_borrow = "allow"
needless_update = "allow"
op_ref = "allow"
redundant_closure = "allow"
type_complexity = "allow"
wrong_self_convention = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[features]
# Empty default. Upstream ksni defaults to tokio, but fc-gpui-linux enables
# only async-io, and this crate refuses to compile with both. Cargo clippy
# lints path dependencies with their default features unified into the
# workspace resolve, so a tokio default would turn both features on.
default = []
blocking = []
node = []
tokio = ["dep:tokio", "zbus/tokio"]
async-io = [
    "dep:async-io",
    "dep:async-lock",
    "dep:async-executor",
    "dep:futures-lite",
    "dep:futures-channel",
    "dep:task-local",
    "zbus/async-io",
]

[dependencies]
arc-swap = "1"
crossbeam-queue = "0.3"
pastey = "0.2"
futures-util = "0.3"
zbus = { version = "5", default-features = false }
serde = { version = "1", features = ["derive"] }

tokio = { version = "1", features = ["rt", "macros"], optional = true }

async-io = { version = "2", optional = true }
async-lock = { version = "3", optional = true }
async-executor = { version = "1", optional = true }
futures-lite = { version = "2", optional = true }
futures-channel = { version = "0.3", optional = true }
task-local = { version = "0.1", optional = true }

# Only the async-io test harness. Upstream also dev-depends on gtk4 for
# examples; those examples are not vendored.
[dev-dependencies]
macro_rules_attribute = "0.2"
smol = "2"
smol-macros = "0.1"
