[workspace]
resolver = "2"
members = [
    "crates/gpui",
    "crates/gpui-compat",
    "crates/gpui-linux",
    "crates/gpui-macos",
    "crates/gpui-macros",
    "crates/gpui-platform",
    "crates/gpui-wgpu",
    "crates/gpui-windows",
    "crates/collections",
    "crates/derive_refineable",
    "crates/http_client",
    "crates/media",
    "crates/perf",
    "crates/refineable",
    "crates/sum_tree",
    "crates/util",
    "crates/util_macros",
    "crates/semantic_version",
    "tests/downstream-compat",
    "tests/downstream-core-with-facade-dev",
    "tests/downstream-renamed-compat",
    "tests/downstream-underscore-alias",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

# Workspace-only: drop zed-scap's unused macOS cocoa/objc graph from the lockfile.
# Published fc-gpui-* manifests still depend on crates.io zed-scap 0.0.8-zed
# (Linux/Windows/FreeBSD screen-capture). See vendor/zed-scap/README.md.
[patch.crates-io]
zed-scap = { path = "vendor/zed-scap" }
