[workspace]
resolver = "2"
members = [
    "crates/gpui",
    "crates/gpui-compat",
    "crates/gpui-linux",
    "crates/gpui-macos",
    "crates/gpui-macros",
    "crates/gpui-platform",
    "crates/gpui-wgpu",
    "crates/gpui-windows",
    "crates/collections",
    "crates/derive_refineable",
    "crates/http_client",
    "crates/media",
    "crates/perf",
    "crates/refineable",
    "crates/sum_tree",
    "crates/util",
    "crates/util_macros",
    "crates/semantic_version",
    "tests/downstream-compat",
    "tests/downstream-core-with-facade-dev",
    "tests/downstream-gpui-alias",
    "tests/downstream-renamed-compat",
    "tests/downstream-underscore-alias",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["FC GPUI Contributors"]
homepage = "https://github.com/freefcw/fc-gpui"
repository = "https://github.com/freefcw/fc-gpui"

# Shared dependency specs. Members inherit with `foo = { workspace = true }`
# and may only add features on top, so versions stay in lockstep across crates.
[workspace.dependencies]
# Internal crates, also usable from downstream via the registry.
collections = { path = "crates/collections", package = "fc-gpui-collections", version = "0.5.1" }
gpui = { path = "crates/gpui", package = "fc-gpui-core", version = "0.10.0", default-features = false }
http_client = { path = "crates/http_client", package = "fc-gpui-http-client", version = "0.5.2" }
util = { path = "crates/util", package = "fc-gpui-util", version = "0.6.0" }
util_macros = { path = "crates/util_macros", package = "fc-gpui-util-macros", version = "0.6.0" }

anyhow = "1.0.86"
async-task = "4.7"
bindgen = "0.73.2"
bytemuck = "1"
derive_more = "2.1.1"
env_logger = "0.11"
etagere = "0.3"
flume = "0.11"
futures = "0.3"
image = { version = "0.25.1", default-features = false }
itertools = "0.15.0"
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
parking = "2.0.0"
parking_lot = "0.12.1"
pathfinder_geometry = "0.5"
pretty_assertions = { version = "1.3.0", features = ["unstable"] }
profiling = "1"
rand = "0.9"
raw-window-handle = "0.6"
regex = "1.11.1"
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
smallvec = "1.6"
smol = "2.0"
strum = { version = "0.28.0", features = ["derive"] }
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }

# Workspace-only lockfile patches. Published fc-gpui-* manifests still
# resolve the registry crates; downstream lockfiles without these patches
# still see the omitted deps. See each vendor/*/README.md.
#
# zed-scap: drop unused macOS cocoa/objc graph (Linux/Windows/FreeBSD capture).
# core-video / core-graphics2: feature-gate unused legacy `block` (only
# display-link / display-stream). CVImageBuffer / pixel-buffer / Metal CV
# paths stay on these crates.
[patch.crates-io]
zed-scap = { path = "vendor/zed-scap" }
core-video = { path = "vendor/core-video" }
core-graphics2 = { path = "vendor/core-graphics2" }
