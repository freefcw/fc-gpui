[package]
edition.workspace = true
name = "fc-gpui-macros"
version = "0.11.0"
publish = true
description = "Macros used by fc-gpui (originally from Zed - github.com/zed-industries/zed)"
authors.workspace = true
repository.workspace = true
readme = false
license.workspace = true

[features]
inspector = []

[lib]
path = "src/gpui_macros.rs"
doctest = false
proc-macro = true

[[test]]
name = "derive_context"
path = "tests/derive_context.rs"

[[test]]
name = "derive_inspector_reflection"
path = "tests/derive_inspector_reflection.rs"

[[test]]
name = "render_test"
path = "tests/render_test.rs"

[dependencies.heck]
version = "0.5"

[dependencies.proc-macro-crate]
version = "3.4"

[dependencies.proc-macro2]
version = "1.0.93"

[dependencies.quote]
version = "1.0.9"

[dependencies.toml_edit]
version = "0.25"
default-features = false
features = ["parse"]

[dependencies.syn]
version = "2.0.101"
features = [
    "full",
    "extra-traits",
    "visit-mut",
]


[dev-dependencies]
gpui = { path = "../gpui", package = "fc-gpui-core" }

[lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
