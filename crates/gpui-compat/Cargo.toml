[package]
edition.workspace = true
name = "fc-gpui"
version = "0.11.1"
authors.workspace = true
publish = true
description = "GPU-accelerated UI framework with system tray, global hotkeys, notifications, and daemon mode support (fork of Zed's GPUI)"
homepage.workspace = true
readme = "README.md"
keywords = [
    "gui",
    "desktop",
    "tray",
    "gpu",
    "daemon",
]
categories = ["gui"]
license.workspace = true
repository.workspace = true

[package.metadata.gpui-macros]
crate = "gpui"

[features]
accessibility = ["gpui_core/accessibility", "gpui_platform/accessibility"]
default = [
    "accessibility",
    "font-kit",
    "keyring",
    "wayland",
    "x11",
    "windows-manifest",
    "image-default-formats",
    "image-rayon",
]
font-kit = ["gpui_core/font-kit", "gpui_platform/font-kit"]
# Secret Service credentials storage on Linux (oo7). Included in default;
# disable with default-features = false to drop oo7 and its unique
# transitive dependencies (credentials methods then return an error).
keyring = ["gpui_platform/keyring"]
image-default-formats = ["gpui_core/image-default-formats", "gpui_platform/image-default-formats"]
image-format-avif = ["gpui_core/image-format-avif", "gpui_platform/image-format-avif"]
image-format-bmp = ["gpui_core/image-format-bmp", "gpui_platform/image-format-bmp"]
image-format-dds = ["gpui_core/image-format-dds", "gpui_platform/image-format-dds"]
image-format-exr = ["gpui_core/image-format-exr", "gpui_platform/image-format-exr"]
image-format-farbfeld = ["gpui_core/image-format-farbfeld", "gpui_platform/image-format-farbfeld"]
image-format-gif = ["gpui_core/image-format-gif", "gpui_platform/image-format-gif"]
image-format-hdr = ["gpui_core/image-format-hdr", "gpui_platform/image-format-hdr"]
image-format-ico = ["gpui_core/image-format-ico", "gpui_platform/image-format-ico"]
image-format-jpeg = ["gpui_core/image-format-jpeg", "gpui_platform/image-format-jpeg"]
image-format-png = ["gpui_core/image-format-png", "gpui_platform/image-format-png"]
image-format-pnm = ["gpui_core/image-format-pnm", "gpui_platform/image-format-pnm"]
image-format-qoi = ["gpui_core/image-format-qoi", "gpui_platform/image-format-qoi"]
image-format-tga = ["gpui_core/image-format-tga", "gpui_platform/image-format-tga"]
image-format-tiff = ["gpui_core/image-format-tiff", "gpui_platform/image-format-tiff"]
image-format-webp = ["gpui_core/image-format-webp", "gpui_platform/image-format-webp"]
image-rayon = ["gpui_core/image-rayon", "gpui_platform/image-rayon"]
input-latency-histogram = ["gpui_core/input-latency-histogram", "gpui_platform/input-latency-histogram"]
inspector = ["gpui_core/inspector", "gpui_platform/inspector"]
leak-detection = ["gpui_core/leak-detection", "gpui_platform/leak-detection"]
runtime_shaders = ["gpui_core/runtime_shaders", "gpui_platform/runtime_shaders"]
screen-capture = ["gpui_core/screen-capture", "gpui_platform/screen-capture"]
test-support = ["gpui_core/test-support", "gpui_platform/test-support"]
wayland = ["gpui_core/wayland", "gpui_platform/wayland"]
windows-manifest = ["gpui_core/windows-manifest", "gpui_platform/windows-manifest"]
wgpu = ["gpui_platform/wgpu"]
x11 = ["gpui_core/x11", "gpui_platform/x11"]

[lib]
name = "gpui"
path = "src/gpui.rs"
doctest = false

[[example]]
name = "image"
path = "examples/image/image.rs"

[[example]]
name = "svg"
path = "examples/svg/svg.rs"

[[test]]
name = "action_macros"
path = "tests/action_macros.rs"

[[test]]
name = "test_macro_glob_import"
path = "tests/test_macro_glob_import.rs"
required-features = ["test-support"]

[[test]]
name = "real_visual_smoke"
path = "tests/real_visual_smoke.rs"
harness = false
required-features = ["test-support"]

[dependencies]
gpui_core = { package = "fc-gpui-core", path = "../gpui", version = "0.11.1", default-features = false }
gpui_platform = { package = "fc-gpui-platform", path = "../gpui-platform", version = "0.11.1", default-features = false }
log.workspace = true

[dev-dependencies]
anyhow.workspace = true
collections = { workspace = true, features = ["test-support"] }
env_logger.workspace = true
futures.workspace = true
http_client = { workspace = true, features = ["test-support"] }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec = { workspace = true, features = ["union", "serde"] }
unicode-segmentation = "1.10"

[dev-dependencies.gpui_macros]
path = "../gpui-macros"
package = "fc-gpui-macros"
version = "0.11.1"

[dev-dependencies.lyon]
version = "1.0"
features = ["extra"]

[dev-dependencies.reqwest]
version = "0.12.28"
features = [
    "rustls-tls-native-roots",
    "stream",
]
default-features = false

[dev-dependencies.schemars]
version = "1.0"
features = ["indexmap2", "smallvec1"]


[lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
