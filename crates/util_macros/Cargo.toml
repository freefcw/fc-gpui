[package]
edition.workspace = true
name = "fc-gpui-util-macros"
version = "0.6.0"
publish = true
description = "Utility macros for fc-gpui (originally from Zed - github.com/zed-industries/zed)"
authors.workspace = true
repository.workspace = true
readme = false
license.workspace = true

[features]
perf-enabled = ["dep:perf"]

[lib]
path = "src/util_macros.rs"
doctest = false
proc-macro = true

[dependencies.perf]
path = "../perf"
package = "fc-gpui-perf"
version = "0.5.1"
optional = true

[dependencies.quote]
version = "1.0.9"

[dependencies.syn]
version = "2.0.101"
features = [
    "full",
    "extra-traits",
    "visit-mut",
]


[lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
