[package]
name = "fc-gpui-macos"
version = "0.10.0"
edition.workspace = true
authors.workspace = true
build = "build.rs"
publish = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
description = "macOS platform and Metal renderer backend for Adabraka GPUI"

[lib]
name = "gpui_macos"
path = "src/gpui_macos.rs"
doctest = false

[features]
default = ["accessibility", "font-kit"]
accessibility = ["dep:accesskit", "dep:accesskit_macos", "gpui/accessibility"]
font-kit = ["dep:font-kit", "gpui/font-kit"]
runtime_shaders = []
screen-capture = ["dep:objc2-core-media", "dep:objc2-screen-capture-kit", "gpui/screen-capture"]
test-support = ["gpui/test-support"]

[target.'cfg(target_os = "macos")'.dependencies]
accesskit = { version = "0.25.1", optional = true }
accesskit_macos = { version = "0.27.1", optional = true }
anyhow.workspace = true
async-task.workspace = true
block2 = "0.6"
collections.workspace = true
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
core-graphics = "0.24"
core-text = "=21.0.0"
# CV pixel format / image buffer for Metal presentables. Not the crate's
# `display-link` feature (legacy `block`); see vendor/core-video.
core-video = { version = "0.5.2", default-features = false, features = ["link"] }
dispatch2 = { version = "0.3.1", features = ["std", "block2"], default-features = false }
etagere.workspace = true
font-kit = { package = "zed-font-kit", version = "0.14.1-zed", optional = true }
foreign-types = "0.5"
futures.workspace = true
gpui.workspace = true
image.workspace = true
itertools.workspace = true
libc.workspace = true
log.workspace = true
media = { package = "fc-gpui-media", path = "../media", version = "0.5.2" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAlert", "NSApplication", "NSApplicationScripting", "NSAppearance", "NSAttributedString", "NSButton", "NSCell", "NSColor", "NSControl", "NSCursor", "NSDockTile", "NSDocumentController", "NSDragging", "NSEvent", "NSGraphics", "NSImage", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSProgressIndicator", "NSResponder", "NSRunningApplication", "NSSavePanel", "NSScreen", "NSScroller", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSTextInputClient", "NSTextInputContext", "NSTrackingArea", "NSView", "NSViewController", "NSVisualEffectView", "NSWindow", "NSWindowRestoration", "NSWindowTabGroup", "NSWorkspace", "block2", "libc", "objc2-core-foundation", "objc2-core-graphics", "objc2-quartz-core", "std"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFCGTypes", "objc2"] }
objc2-core-media = { version = "0.3", optional = true, default-features = false, features = ["CMSampleBuffer", "objc2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSAttributedString", "NSAutoreleasePool", "NSBundle", "NSCoder", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSIndexSet", "NSKeyedArchiver", "NSLocale", "NSNotification", "NSObjCRuntime", "NSObject", "NSProcessInfo", "NSRange", "NSString", "NSThread", "NSURL", "NSUserDefaults", "NSValue", "objc2-core-foundation", "std"] }
objc2-metal = { version = "0.3", default-features = false, features = ["MTLAllocation", "MTLBlitCommandEncoder", "MTLBuffer", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLDevice", "MTLDrawable", "MTLLibrary", "MTLPixelFormat", "MTLRenderCommandEncoder", "MTLRenderPass", "MTLRenderPipeline", "MTLResource", "MTLTexture", "MTLTypes", "bitflags", "block2", "dispatch2", "std"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer", "CAMetalLayer", "objc2-core-foundation", "objc2-core-graphics", "objc2-metal"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext", "block2"] }
objc2-screen-capture-kit = { version = "0.3", optional = true, default-features = false, features = ["SCError", "SCShareableContent", "SCStream", "block2", "dispatch2", "objc2-core-graphics", "objc2-core-media", "std"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNUserNotificationCenter", "block2"] }
parking.workspace = true
parking_lot.workspace = true
pathfinder_geometry.workspace = true
raw-window-handle.workspace = true
smallvec.workspace = true
smol.workspace = true
strum.workspace = true
util.workspace = true
uuid.workspace = true

[build-dependencies]
bindgen.workspace = true
cbindgen = { version = "0.29.4", default-features = false }
gpui.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0

[lints.clippy.style]
level = "allow"
priority = -1
