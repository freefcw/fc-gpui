[package]
edition.workspace = true
name = "fc-gpui-media"
version = "0.6.1"
build = "build.rs"
publish = true
description = "Bindings to macOS media handling APIs (originally from Zed - github.com/zed-industries/zed)"
authors.workspace = true
repository.workspace = true
readme = false
license.workspace = true

# Used only from build.rs, and only when the host is macOS.
# cargo-machete --with-metadata does not see that cfg-gated build script.
[package.metadata.cargo-machete]
ignored = ["bindgen"]

[lib]
path = "src/media.rs"
doctest = false

[dependencies]
anyhow.workspace = true


[build-dependencies]
bindgen.workspace = true

[target.'cfg(target_os = "macos")'.dependencies.core-foundation]
version = "0.10.1"

# CVImageBuffer + pixel-format constants for CMSampleBuffer / CVMetalTextureCache.
# `display-link` (legacy `block`) is unused. See vendor/core-video.
[target.'cfg(target_os = "macos")'.dependencies]
core-video.workspace = true

[lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
