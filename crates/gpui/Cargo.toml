[package]
edition = "2024"
name = "fc-gpui-core"
version = "0.9.0"
authors = ["Adabraka Team"]
publish = true
description = "GPU-accelerated UI framework with system tray, global hotkeys, notifications, and daemon mode support (fork of Zed's GPUI)"
homepage = "https://github.com/freefcw/fc-gpui"
readme = "README.md"
keywords = [
    "gui",
    "desktop",
    "tray",
    "gpu",
    "daemon",
]
categories = ["gui"]
license = "Apache-2.0"
repository = "https://github.com/freefcw/fc-gpui"

[features]
accessibility = []
bench = ["test-support"]
default = [
    "accessibility",
    "font-kit",
    "wayland",
    "x11",
    "windows-manifest",
    "image-default-formats",
    "image-rayon",
]
# Common formats enabled by default. Less common formats (avif, bmp, dds, exr,
# farbfeld, hdr, ico, pnm, qoi, tga, tiff) are still available as opt-in via the
# individual `image-format-*` features.
image-default-formats = [
    "image-format-gif",
    "image-format-jpeg",
    "image-format-png",
    "image-format-webp",
]
image-format-avif = ["image/avif"]
image-format-bmp = ["image/bmp"]
image-format-dds = ["image/dds"]
image-format-exr = ["image/exr"]
image-format-farbfeld = ["image/ff"]
image-format-gif = ["image/gif"]
image-format-hdr = ["image/hdr"]
image-format-ico = ["image/ico"]
image-format-jpeg = ["image/jpeg"]
image-format-png = ["image/png"]
image-format-pnm = ["image/pnm"]
image-format-qoi = ["image/qoi"]
image-format-tga = ["image/tga"]
image-format-tiff = ["image/tiff"]
image-format-webp = ["image/webp"]
image-rayon = ["image/rayon"]
font-kit = []
inspector = ["gpui_macros/inspector"]
input-latency-histogram = ["dep:hdrhistogram"]
leak-detection = ["dep:backtrace"]
runtime_shaders = []
screen-capture = ["dep:scap", "dep:windows-capture"]
test-support = [
    "leak-detection",
    "collections/test-support",
    "dep:rand",
    "util/test-support",
    "http_client/test-support",
    "wayland",
    "x11",
]
wayland = ["dep:bitflags"]
windows-manifest = []
x11 = ["scap?/x11"]

[lib]
name = "gpui_core"
path = "src/gpui.rs"
doctest = false

[[bench]]
name = "async_tasks"
path = "benches/async_tasks.rs"
harness = false
required-features = ["bench"]

[dependencies.accesskit]
version = "0.24.0"

[dependencies.anyhow]
version = "1.0.86"

[dependencies.async-channel]
version = "2.5.0"

[dependencies.async-task]
version = "4.7"

[dependencies.backtrace]
version = "0.3"
optional = true

[dependencies.collections]
path = "../collections"
package = "fc-gpui-collections"
version = "0.5.1"

[dependencies.ctor]
version = "0.3.0"

[dependencies.derive_more]
version = "0.99.17"

[dependencies.etagere]
version = "0.2"

[dependencies.futures]
version = "0.3"

[dependencies.hdrhistogram]
version = "7"
optional = true

[dependencies.gpui_macros]
path = "../gpui-macros"
package = "fc-gpui-macros"
version = "0.9.0"

[dependencies.http_client]
path = "../http_client"
package = "fc-gpui-http-client"
version = "0.5.1"

[dependencies.image]
version = "0.25.1"
default-features = false

[dependencies.inventory]
version = "0.3.19"

[dependencies.itertools]
version = "0.14.0"

[dependencies.libc]
version = "0.2"

[dependencies.log]
version = "0.4.16"
features = [
    "kv_unstable_serde",
    "serde",
]

[dependencies.lyon]
version = "1.0"

[dependencies.num_cpus]
version = "1.13"

[dependencies.parking]
version = "2.0.0"

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.postage]
version = "0.5"
features = ["futures-traits"]

[dependencies.profiling]
version = "1"

[dependencies.rand]
version = "0.9"
optional = true

[dependencies.raw-window-handle]
version = "0.6"

[dependencies.refineable]
path = "../refineable"
package = "fc-gpui-refineable"
version = "0.5.1"

[dependencies.regex]
version = "1.11.1"

[dependencies.resvg]
version = "0.47"
features = [
    "text",
    "system-fonts",
    "memmap-fonts",
    "raster-images",
]
default-features = false

[dependencies.schemars]
version = "1.0"
features = ["indexmap2", "smallvec1"]

[dependencies.seahash]
version = "4.1"

[dependencies.semantic_version]
path = "../semantic_version"
package = "fc-gpui-semantic-version"
version = "0.5.1"

[dependencies.serde]
version = "1.0.221"
features = [
    "derive",
    "rc",
]

[dependencies.serde_json]
version = "1.0.144"
features = [
    "preserve_order",
    "raw_value",
]

[dependencies.slotmap]
version = "1.0.6"

[dependencies.smallvec]
version = "1.6"
features = ["union", "serde"]

[dependencies.smol]
version = "2.0"

[dependencies.smol_str]
version = "0.3"

[dependencies.stacksafe]
version = "0.1"

[dependencies.strum]
version = "0.27.0"
features = ["derive"]

[dependencies.sum_tree]
path = "../sum_tree"
package = "fc-gpui-sum-tree"
version = "0.5.1"

[dependencies.taffy]
version = "=0.13.0"

[dependencies.thiserror]
version = "2.0.12"

[dependencies.ttf-parser]
version = "0.25"

[dependencies.usvg]
version = "0.47"
default-features = false

[dependencies.util]
path = "../util"
package = "fc-gpui-util"
version = "0.6.0"

[dependencies.util_macros]
path = "../util_macros"
package = "fc-gpui-util-macros"
version = "0.6.0"

[dependencies.uuid]
version = "1.1.2"
features = [
    "v4",
    "v5",
    "v7",
    "serde",
]

[dependencies.waker-fn]
version = "1.2.0"


[dev-dependencies.backtrace]
version = "0.3"

[dev-dependencies.collections]
path = "../collections"
features = ["test-support"]
package = "fc-gpui-collections"
version = "0.5.1"

[dev-dependencies.criterion]
version = "0.5"

[dev-dependencies.env_logger]
version = "0.11"

[dev-dependencies.http_client]
path = "../http_client"
features = ["test-support"]
package = "fc-gpui-http-client"
version = "0.5.1"

[dev-dependencies.lyon]
version = "1.0"
features = ["extra"]

[dev-dependencies.pretty_assertions]
version = "1.3.0"
features = ["unstable"]

[dev-dependencies.rand]
version = "0.9"

[dev-dependencies.reqwest]
version = "0.12.15-zed"
features = [
    "rustls-tls-native-roots",
    "stream",
]
default-features = false
package = "zed-reqwest"

[dev-dependencies.unicode-segmentation]
version = "1.10"

[dev-dependencies.util]
path = "../util"
features = ["test-support"]
package = "fc-gpui-util"
version = "0.6.0"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.bitflags]
version = "2.6"
optional = true

# Optional Linux/Windows/FreeBSD capture only. macOS uses objc2-screen-capture-kit.
# Registry zed-scap 0.0.8-zed (and Zed git pin 4afea48) still declare macOS
# cocoa/objc/screencapturekit; root [patch.crates-io] points at vendor/zed-scap
# so those unused deps leave this lockfile. The published manifest still names
# crates.io zed-scap 0.0.8-zed.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "windows"))'.dependencies.scap]
version = "0.0.8-zed"
optional = true
default-features = false
package = "zed-scap"

# Not used directly: zed-scap 0.0.8-zed calls the five-argument
# `Settings::new` that windows-capture 1.5 replaced with an eight-argument
# form, and its own `^1.3.6` requirement would otherwise resolve to 1.5.
# Declaring the ceiling here keeps the constraint in the published manifest.
[target.'cfg(target_os = "windows")'.dependencies.windows-capture]
version = ">=1.3.6, <1.5"
optional = true

# Pixel-buffer / CVImageBuffer types for Surface and macOS screen-capture
# frames. `display-link` (legacy `block`) is unused: frame pacing is
# `gpui-macos` `display_link.rs`. Workspace [patch] feature-gates `block`;
# published manifests still resolve registry 0.5.2 (see vendor/core-video).
[target.'cfg(target_os = "macos")'.dependencies.core-video]
version = "0.5.2"
default-features = false
features = ["link"]

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    # Used by the test platform (test-support) for bitmap rendering.
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Ole",
]

[lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
