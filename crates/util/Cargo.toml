[package]
edition.workspace = true
name = "fc-gpui-util"
version = "0.6.0"
publish = true
description = "A collection of utility structs and functions for Adabraka GPUI (originally from Zed - github.com/zed-industries/zed)"
authors.workspace = true
repository.workspace = true
readme = false
license.workspace = true

[features]
test-support = [
    "dep:git2",
    "dep:rand",
    "dep:util_macros",
]

[lib]
path = "src/util.rs"
doctest = true

[dependencies]
anyhow.workspace = true
collections.workspace = true
futures.workspace = true
itertools.workspace = true
log.workspace = true
rand = { workspace = true, optional = true }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
util_macros = { workspace = true, optional = true }

[dependencies.async-fs]
version = "2.1"

[dependencies.async_zip]
version = "0.0.19"
features = [
    "deflate",
    "deflate64",
]

[dependencies.dirs]
version = "7.0"

[dependencies.dunce]
version = "1.0"

[dependencies.futures-lite]
version = "2"

[dependencies.git2]
version = "0.21.0"
optional = true
default-features = false

[dependencies.globset]
version = "0.4"

[dependencies.rust-embed]
version = "8.4"
features = ["include-exclude"]

[dependencies.schemars]
version = "1.0"
features = ["indexmap2"]

[dependencies.serde_json_lenient]
version = "0.2"
features = [
    "preserve_order",
    "raw_value",
]

[dependencies.shlex]
version = "1.3.0"

[dependencies.take-until]
version = "0.3.0"

[dependencies.tempfile]
version = "3.20.0"

[dependencies.unicase]
version = "2.6"

[dependencies.walkdir]
version = "2.5"

[dependencies.which]
version = "8"


[dev-dependencies]
git2 = { version = "0.21.0", default-features = false }
indoc = "2"
pretty_assertions.workspace = true
rand.workspace = true
util_macros.workspace = true

[target."cfg(unix)".dependencies.command-fds]
version = "0.3.1"

[target."cfg(unix)".dependencies.libc]
version = "0.2"

[target."cfg(unix)".dependencies.nix]
version = "0.31"
features = [
    "resource",
    "user",
]

[target."cfg(windows)".dependencies.tendril]
version = "0.4.3"

[lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
