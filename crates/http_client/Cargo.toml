[package]
edition.workspace = true
name = "fc-gpui-http-client"
version = "0.6.0"
publish = true
description = "A HTTP client library for fc-gpui (originally from Zed - github.com/zed-industries/zed)"
authors.workspace = true
repository.workspace = true
readme = false
license.workspace = true

[features]
default = ["reqwest"]
reqwest = ["dep:reqwest"]
test-support = []
# Opt-in macOS System Settings proxy auto-detection. Off by default: env-var
# proxies (HTTP_PROXY/HTTPS_PROXY/...) work without it. Downstream can also
# re-enable via their own `reqwest` dep (features unify).
macos-system-proxy = ["reqwest", "reqwest/macos-system-configuration"]

[lib]
path = "src/http_client.rs"
doctest = true

[dependencies]
anyhow.workspace = true
async-fs.workspace = true
derive_more = { workspace = true, features = ["deref"] }
futures.workspace = true
log.workspace = true
parking_lot.workspace = true
# Retained by default for the reqwest-specific multipart and body-conversion
# APIs. Protocol-only clients can disable default features.
reqwest = { workspace = true, optional = true, features = [
    "charset",
    "http2",
    "multipart",
    "rustls-tls-native-roots",
    "stream",
] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
util.workspace = true

[dependencies.async-compression]
version = "0.4"
features = [
    "gzip",
    "futures-io",
]

[dependencies.blocking]
version = "1"

[dependencies.bytes]
version = "1.0"

[dependencies.http]
version = "1.1"

[dependencies.http-body]
version = "1.0"

[dependencies.sha2]
version = "0.11"

[dependencies.tar]
version = "0.4"

[dependencies.url]
version = "2.2"


[lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
