[package]
edition.workspace = true
name = "fc-gpui-http-client"
version = "0.5.2"
publish = true
description = "A HTTP client library for Adabraka GPUI (originally from Zed - github.com/zed-industries/zed)"
authors.workspace = true
repository.workspace = true
readme = false
license.workspace = true

[features]
test-support = []

[lib]
name = "adabraka_http_client"
path = "src/http_client.rs"
doctest = true

[dependencies]
anyhow.workspace = true
derive_more = { workspace = true, features = ["deref"] }
futures.workspace = true
log.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
util.workspace = true

[dependencies.async-compression]
version = "0.4"
features = [
    "gzip",
    "futures-io",
]

[dependencies.async-fs]
version = "2.1"

[dependencies.async-tar]
version = "0.6.1"

[dependencies.bytes]
version = "1.0"

[dependencies.http]
version = "1.1"

[dependencies.http-body]
version = "1.0"

[dependencies.reqwest]
version = "0.12.15-zed"
features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "multipart",
    "rustls-tls-native-roots",
    "socks",
    "stream",
]
default-features = false
package = "zed-reqwest"

[dependencies.sha2]
version = "0.10"

[dependencies.tempfile]
version = "3.20.0"

[dependencies.url]
version = "2.2"

# async-tar's async-std backend calls async_std::os::windows::fs::symlink_file,
# which is gated behind async-std's `unstable` feature (upstream async-tar does
# not forward it). Declare it here so Windows builds compile the symlink path.
[target.'cfg(windows)'.dependencies.async-std]
version = "1.13"
features = ["unstable"]


[lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
large_enum_variant = "allow"
let_underscore_future = "allow"
nonminimal_bool = "allow"
redundant_clone = "deny"
single_range_in_vec_init = "allow"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[lints.rust.unexpected_cfgs]
level = "allow"
priority = 0
