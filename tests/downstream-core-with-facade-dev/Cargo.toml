[package]
name = "fc-gpui-core-with-facade-dev-compat"
version = "0.0.0"
edition = "2024"
publish = false
license.workspace = true

# Dev-dependency present so gpui-macros' proc-macro-crate probe sees both
# fc-gpui (facade_ui) and fc-gpui-core (core_ui). Nothing in this crate
# imports facade_ui by path, so cargo-machete reports it as unused.
[package.metadata.cargo-machete]
ignored = ["facade_ui"]

[package.metadata.gpui-macros]
crate = "core_ui"

[dependencies]
core_ui = { package = "fc-gpui-core", path = "../../crates/gpui", default-features = false }

[dev-dependencies]
facade_ui = { package = "fc-gpui", path = "../../crates/gpui-compat", default-features = false }
