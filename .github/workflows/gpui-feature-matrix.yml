name: GPUI feature matrix

on:
  pull_request:
  push:
    branches:
      - main
      - develop/0.9

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  upstream-provenance:
    name: Upstream provenance
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch audited Zed history without blobs
        shell: bash
        run: |
          audited_commit="$(jq -r '.audited_upstream' docs/sync/upstream-audit.json)"
          compared_against="$(jq -r '.compared_against // empty' docs/sync/upstream-audit.json)"
          git init "$RUNNER_TEMP/zed-upstream"
          git -C "$RUNNER_TEMP/zed-upstream" remote add origin https://github.com/zed-industries/zed.git
          fetch_refs=("$audited_commit")
          if [[ -n "$compared_against" ]]; then
            fetch_refs+=("$compared_against")
          fi
          git -C "$RUNNER_TEMP/zed-upstream" fetch --filter=blob:none origin "${fetch_refs[@]}"
          git -C "$RUNNER_TEMP/zed-upstream" checkout --detach "$audited_commit"

      - name: Verify classifications and Zed-Origin trailers
        env:
          UPSTREAM_REPO: ${{ runner.temp }}/zed-upstream
        run: scripts/verify-upstream-sync.sh

  format:
    name: Rustfmt
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.97.1 with rustfmt
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwayland-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Install Rust 1.97.1 with Clippy
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: gpui-clippy

      - name: Lint workspace libraries and tests
        run: cargo clippy --workspace --lib --tests --locked -- -D warnings

  workflow-hygiene:
    name: Workflow and shell hygiene
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check shell scripts
        run: shellcheck --source-path=scripts -x scripts/*.sh

      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.9

      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@e639db99335bc9038abc0e066dfcd72e23d26fb4 # v0.3.0
        with:
          advanced-security: false
          online-audits: false
          min-severity: high
          version: 1.9.0

  release-archives:
    name: Release archives
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwayland-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            mesa-vulkan-drivers \
            pkg-config

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: gpui-release-archives

      - name: Build and verify packaged crates
        run: scripts/verify-release-archives.sh

  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / workspace tests
            os: ubuntu-24.04
            cache-key: linux-workspace-tests
            linux-native: true
            examples: true
            command: cargo test --workspace --lib --tests --locked -- --test-threads=1
          - name: Linux / no default features
            os: ubuntu-24.04
            cache-key: linux-no-default
            linux-native: false
            command: cargo check -p fc-gpui --lib --no-default-features --locked
          - name: Linux / async benchmark compile
            os: ubuntu-24.04
            cache-key: linux-async-benchmark
            linux-native: false
            command: cargo check -p fc-gpui-core --features bench --benches --locked
          - name: Linux / feature contracts
            os: ubuntu-24.04
            cache-key: linux-feature-contracts
            linux-native: true
            command: bash scripts/verify-features.sh
          - name: Linux X11 / real visual smoke
            os: ubuntu-24.04
            cache-key: linux-x11-real-visual
            linux-native: true
            require_real_visual: true
            allow_failure: true
            software_gl: true
            command: timeout --kill-after=30s 12m xvfb-run -a cargo test -p fc-gpui --test real_visual_smoke --features test-support,x11 --locked -- --ignored
          - name: Linux / accessibility + X11
            os: ubuntu-24.04
            cache-key: linux-accessibility-x11
            linux-native: true
            command: cargo check -p fc-gpui --lib --no-default-features --features accessibility,font-kit,x11 --locked
          - name: Linux / accessibility + Wayland
            os: ubuntu-24.04
            cache-key: linux-accessibility-wayland
            linux-native: true
            command: cargo check -p fc-gpui --lib --no-default-features --features accessibility,font-kit,wayland --locked
          - name: macOS / workspace tests
            os: macos-14
            cache-key: macos-workspace-tests
            linux-native: false
            examples: true
            command: cargo test --workspace --lib --tests --locked -- --test-threads=1
          - name: macOS / no default features
            os: macos-14
            cache-key: macos-no-default
            linux-native: false
            command: cargo check -p fc-gpui --lib --no-default-features --locked
          - name: macOS / real visual smoke
            os: macos-14
            cache-key: macos-real-visual
            linux-native: false
            require_real_visual: true
            command: cargo test -p fc-gpui --test real_visual_smoke --features test-support --locked -- --ignored
          - name: Windows / workspace tests
            os: windows-2022
            cache-key: windows-workspace-tests
            linux-native: false
            examples: true
            command: cargo test --workspace --lib --tests --locked -- --test-threads=1
          - name: Windows / no default features
            os: windows-2022
            cache-key: windows-no-default
            linux-native: false
            command: cargo check -p fc-gpui --lib --no-default-features --locked
          - name: Windows / real visual smoke
            os: windows-2022
            cache-key: windows-real-visual
            linux-native: false
            require_real_visual: true
            command: cargo test -p fc-gpui --test real_visual_smoke --features test-support --locked -- --ignored

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Linux native dependencies
        if: runner.os == 'Linux' && matrix.linux-native
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwayland-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            mesa-vulkan-drivers \
            libegl1 \
            libgles2 \
            libgl1-mesa-dri \
            pkg-config \
            xvfb

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: gpui-${{ matrix.cache-key }}

      # Job-level continue-on-error still reports this matrix check as failure
      # and leaves mergeable_state=unstable. Step-level keeps the required
      # check green when only Linux X11 real visual smoke is allow-failure.
      - name: Check GPUI feature combination
        continue-on-error: ${{ matrix.allow_failure || false }}
        env:
          GPUI_REQUIRE_REAL_VISUAL: ${{ matrix.require_real_visual && '1' || '0' }}
          LIBGL_ALWAYS_SOFTWARE: ${{ matrix.software_gl && '1' || '' }}
          WGPU_BACKEND: ${{ matrix.software_gl && 'gl' || '' }}
        run: ${{ matrix.command }}

      - name: Check public examples
        if: matrix.examples
        run: cargo check -p fc-gpui --examples --locked
