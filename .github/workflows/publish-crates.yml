name: Publish crates

on:
  push:
    tags:
      - "v*"
  # Manual recovery path: re-runs skip versions already on crates.io, so a
  # partially failed release can be resumed from the Actions tab.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify only, without uploading to crates.io"
        required: true
        type: boolean
        default: true

# Never run two publishes concurrently; crates.io uploads are not idempotent
# within a single version, and the sparse-index waits assume linear order.
concurrency:
  group: publish-crates
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1

      - name: Check tag matches fc-gpui version
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(awk '/^\[package\]/{p=1} p && /^version = /{gsub(/"/,"",$3); print $3; exit}' crates/gpui-compat/Cargo.toml)"
          if [[ "$tag_version" != "$crate_version" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match fc-gpui version ${crate_version}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches fc-gpui ${crate_version}"

      - name: Verify release archives
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        run: scripts/verify-release-archives.sh

      - name: Publish workspace crates in topological order
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-release.sh

      - name: Verify dry-run release
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: DRY_RUN=1 scripts/publish-release.sh
